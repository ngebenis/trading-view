<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDX Trading View</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">IDX Trading View</div>
    <form id="search">
      <input id="symbolInput" placeholder="Kode saham, mis. BBCA" autocomplete="off">
      <button>Buka</button>
    </form>
    <div class="header-right">
      <label>Broker
        <select id="brokerSelect"></select>
      </label>
      <span id="dataSource" class="badge"></span>
    </div>
  </header>

  <main>
    <aside class="panel" id="watchlistPanel">
      <h2>Watchlist</h2>
      <ul id="watchlist"></ul>
      <form id="addWatch"><input id="addWatchInput" placeholder="+ tambah kode"></form>
    </aside>

    <section class="center">
      <div class="quote-bar">
        <span id="qSymbol" class="q-symbol">—</span>
        <span id="qPrice" class="q-price">—</span>
        <span id="qChange" class="q-change"></span>
        <span class="links">
          <a id="lnkStockbit" target="_blank" rel="noopener">Stockbit ↗</a>
          <a id="lnkTradingView" target="_blank" rel="noopener">TradingView ↗</a>
        </span>
      </div>
      <div id="tvChart" class="chart"></div>
    </section>

    <aside class="panel" id="tradePanel">
      <h2>Sinyal Teknikal</h2>
      <div id="signal" class="signal">—</div>
      <ul id="reasons" class="reasons"></ul>
      <p class="disclaimer">Sinyal otomatis, bukan rekomendasi investasi.</p>

      <h2>Order</h2>
      <div id="brokerNote" class="note hidden"></div>
      <form id="orderForm">
        <div class="seg">
          <button type="button" data-side="BUY" class="buy active">Beli</button>
          <button type="button" data-side="SELL" class="sell">Jual</button>
        </div>
        <label>Tipe
          <select id="orderType"><option value="MARKET">Market</option><option value="LIMIT">Limit</option></select>
        </label>
        <label id="limitWrap" class="hidden">Harga limit
          <input id="limitPrice" type="number" step="1">
          <small id="tickHint"></small>
        </label>
        <label>Jumlah lot (1 lot = 100 lembar)
          <input id="lots" type="number" min="1" value="1">
        </label>
        <div class="estimate" id="estimate"></div>
        <button id="submitOrder" class="primary buy">Beli</button>
        <div id="orderMsg" class="msg"></div>
      </form>
    </aside>
  </main>

  <section class="bottom">
    <div class="tabs">
      <button class="tab active" data-tab="portfolio">Portofolio</button>
      <button class="tab" data-tab="orders">Riwayat Order</button>
      <button id="resetPaper" class="link">Reset akun simulasi</button>
    </div>
    <div id="summary" class="summary"></div>
    <div class="table-wrap">
      <table id="portfolioTable"></table>
      <table id="ordersTable" class="hidden"></table>
    </div>
  </section>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
